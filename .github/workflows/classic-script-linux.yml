# Throwaway: proves the Azure DevOps Classic script on a real Ubuntu agent (the same image ADO's
# hosted ubuntu-latest pool uses), including a real CGO build of the scanner. Delete once green.
name: Classic script on Linux

on:
  push:
    branches: [master]
    paths:
      - backend/app/ci_scripts/**
      - backend/tests/test_azure_classic_script.py
      - .github/workflows/classic-script-linux.yml
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the real scanner (CGO on; a CGO-off build finds nothing)
        run: git clone --depth 1 --branch v0.38.0 https://github.com/Mohamedashmar432/zero-strike-SAST-engine.git scanner
      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
          cache: false
      - run: CGO_ENABLED=1 go build -o "$RUNNER_TEMP/zerostrike_linux_amd64" ./cmd/zerostrike
        working-directory: scanner

      - name: Real scanner on a vulnerable sample (published as annotations)
        run: |
          mkdir -p "$RUNNER_TEMP/fx"
          printf '%s\n' 'import os' 'from flask import request' 'def handler():' \
            "    cmd = request.args.get('cmd')" '    os.system(cmd)' > "$RUNNER_TEMP/fx/vuln.py"
          rc=0
          "$RUNNER_TEMP/zerostrike_linux_amd64" scan "$RUNNER_TEMP/fx" --enable-secrets --enable-sca \
            --enable-framework-checks --format json --output "$RUNNER_TEMP/fx.json" || rc=$?
          echo "::notice title=Real scanner exit code::$rc (0 clean, 1 findings found, 2+ error)"
          echo "::notice title=Real scanner findings::$(jq -c '[.. | objects | select(has("RuleID")) | "\(.RuleID) \(.Severity)"]' "$RUNNER_TEMP/fx.json")"
          echo "::notice title=Severity lines (the gate greps a 6-space indent)::$(grep -n '"Severity"' "$RUNNER_TEMP/fx.json" | head -5 | sed 's/^/[/;s/$/]/' | tr '\n' ' ')"
          [ "$rc" -le 1 ]

      - name: Tools the script needs (preinstalled on ubuntu-latest)
        run: |
          bash --version | head -1; curl --version | head -1; jq --version; sha256sum --version | head -1

      - name: shellcheck (all notes, then fail on warnings)
        run: |
          shellcheck backend/app/ci_scripts/azure-classic.sh || true
          shellcheck -S warning backend/app/ci_scripts/azure-classic.sh

      # The steps below still run if shellcheck fails, so one run reports everything.
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        if: ${{ !cancelled() }}
        working-directory: backend

      - name: Run the inline script exactly as the Bash task does (stub portal, stub + real scanner)
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          ZEROSTRIKE_REAL_SCANNER: ${{ runner.temp }}/zerostrike_linux_amd64
        run: pytest tests/test_azure_classic_script.py -v -rA -s 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # Job logs need a GitHub sign-in to read; annotations and the step summary do not, so the
      # evidence is published there too.
      - name: Publish test evidence
        if: ${{ !cancelled() }}
        run: |
          L="$RUNNER_TEMP/pytest.log"
          echo "::notice title=pytest result::$(grep -E '^=+ .*(passed|failed|error)' "$L" | tail -1 | tr -d '=')"
          echo "::notice title=pytest per test::$(grep -E '^(PASSED|FAILED|SKIPPED|ERROR) ' "$L" | sed 's#tests/test_azure_classic_script.py::##' | tr '\n' ';')"
          echo "::notice title=Real scanner through the inline script (gate none)::$(grep -E 'thinkShield:|##vso' "$L" | sed 's/##vso/vso/' | tr '\n' ';')"
          { echo '## Classic script on Linux'; echo '```'; grep -E '^(PASSED|FAILED|SKIPPED|ERROR) |thinkShield:' "$L"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
